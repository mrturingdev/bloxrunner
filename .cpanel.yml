---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/bloxrunner.mrturingdev.com/
    - mkdir -p "$DEPLOYPATH"
    - if [ "$(cd . && pwd -P)" != "$(cd "$DEPLOYPATH" && pwd -P)" ]; then rsync -a --delete --exclude=.git --exclude=.github --exclude=.cpanel.yml --exclude=README.md --exclude=.well-known --exclude=cgi-bin ./. "$DEPLOYPATH"; fi
