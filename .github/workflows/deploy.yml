name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '2083' }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_REPO: ${{ secrets.CPANEL_REPO }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for v in CPANEL_HOST CPANEL_USER CPANEL_TOKEN CPANEL_REPO; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Trigger cPanel deployment
        run: |
          url="https://$CPANEL_HOST:$CPANEL_PORT/execute/VersionControlDeployment/create?repository_root=$CPANEL_REPO"
          resp=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" "$url")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          printf '%s' "$body" | jq -c '{status, errors, deploy_id: .data.deploy_id, log_path: .data.log_path}'
          if [ "$code" != "200" ]; then
            echo "::error::cPanel API returned HTTP $code"
            exit 1
          fi
          if [ "$(printf '%s' "$body" | jq -r '.status')" != "1" ]; then
            echo "::error::Deployment rejected — see errors above"
            exit 1
          fi
