<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloxrunner</title>
<link rel="icon" href="../logo/bloxrunner-icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="450"></canvas>
  <div id="ui">
    <div class="brand" id="brand">
      <img src="../logo/bloxrunner-logo.png" id="logo" alt="Bloxrunner" style="width:min(280px,68vw);max-height:16vh;object-fit:contain;height:auto">
      <p style="margin:2px 0 0;font-size:clamp(12px,3.2vw,15px);font-weight:bold;letter-spacing:1.8px;text-transform:uppercase;color:#ffb347">Run. Jump. Survive.</p>
      <p style="margin:0 0 6px;font-size:clamp(11px,2.6vw,13px);color:#ffd23f;font-weight:600">by Pranav Maharjan</p>
    </div>
    <h1 id="title" style="display:none">Bloxrunner</h1>
    <p id="msg">Tap, click or press Space to jump. Hold for a higher jump. Duck with the down arrow. Grab ⚡ to smash through obstacles and ⏳ to slow time.</p>
    <p><b>Tap to start</b></p>
    <button id="shopBtn">🛒 Skins shop</button>
  </div>
  <div id="shop"><header><h2>Skins shop</h2><span id="bal"></span></header><div id="cards"></div><button id="back">Back</button></div>
</div>
<script src="js/game.js"></script>
</body>
</html>
