<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloxrunner</title>
<link rel="icon" href="../logo/bloxrunner-icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="450"></canvas>
  <div id="ui">
    <h1 id="title">Bloxrunner</h1>
    <p id="msg">Tap, click or press Space to jump. Hold for a higher jump. Duck with the down arrow. Grab ⚡ to smash through obstacles and ⏳ to slow time.</p>
    <p><b>Tap to start</b></p>
    <button id="shopBtn">🛒 Skins shop</button>
  </div>
  <div id="shop"><header><h2>Skins shop</h2><span id="bal"></span></header><div id="cards"></div><button id="back">Back</button></div>
</div>
<script src="js/game.js"></script>
</body>
</html>
